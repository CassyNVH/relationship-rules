<style>

*{box-sizing:border-box}html{background:#ededed}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;min-height:100dvh}

.notice{width:min(430px,100%);padding:14px 16px;border:1px solid #3b3b3e;border-radius:22px;background:#242426;box-shadow:0 22px 70px #0008;cursor:pointer}

header{height:78px;padding:calc(9px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#fffffff2;backdrop-filter:blur(16px)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-weight:800}.name{line-height:1.15}.name b{font-size:16px}.online{font-size:12px;color:var(--green);margin-top:4px}.days{margin-left:auto;text-align:right;color:var(--muted);font-size:10px;line-height:1.35}
#chat{padding:16px 12px 150px;min-height:calc(100dvh - 78px)}
.row{display:flex;margin:7px 0;animation:up .22s ease-out}.row.me{justify-content:flex-end}.bubble{max-width:84%;padding:10px 13px;border-radius:19px;background:var(--in);font-size:16px;line-height:1.34;white-space:pre-wrap;overflow-wrap:anywhere}.them .bubble{border-bottom-left-radius:6px}.me .bubble{background:var(--green);color:#fff;border-bottom-right-radius:6px}
.system{max-width:88%;margin:17px auto;text-align:center;color:var(--muted);font-size:12px;animation:up .22s}.system strong{color:var(--ink)}
.typing{width:58px;height:36px;margin:7px 0;padding:0 13px;display:flex;align-items:center;gap:4px;background:var(--in);border-radius:18px}.dot{width:6px;height:6px;border-radius:50%;background:#8e8e93;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.14s}.dot:nth-child(3){animation-delay:.28s}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px;animation:up .22s}.choice{padding:10px 14px;border:1px solid var(--green);border-radius:999px;background:#fff;color:var(--gd);font-weight:650;cursor:pointer}.choice.bad{border-color:#ddd;color:#555}.choice:active{transform:scale(.97)}
.card{margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 35px #00000010;animation:up .22s}.card h3{margin:0 0 10px;font-size:14px}.small{font-size:12px;color:var(--muted)}

.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:8px 10px;border:1px solid #ddd;border-radius:999px;background:#fff}.pill:disabled{opacity:.7}
.voice{display:flex;align-items:center;gap:10px}.play{width:34px;height:34px;border:0;border-radius:50%;background:#111;color:#fff}.wave{flex:1;color:#777;letter-spacing:-2px;overflow:hidden}.split{display:flex;justify-content:space-between;align-items:center}.blackbtn{padding:8px 11px;border:0;border-radius:12px;background:#111;color:#fff}
textarea{width:100%;min-height:80px;margin-top:8px;padding:11px;border:1px solid #ddd;border-radius:14px;outline:0;resize:vertical}textarea:focus{border-color:var(--green)}.send{width:100%;margin-top:9px;padding:12px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:750}.heart{color:var(--red)}
